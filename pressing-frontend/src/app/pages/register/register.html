<h2>Inscription</h2>

<form (ngSubmit)="onSubmit()">
  <div>
    <label for="name">Nom</label>
    <input type="text" id="name" name="name" [(ngModel)]="name" required>
  </div>

  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required>
  </div>

  <div>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" [(ngModel)]="password" required>
  </div>

  <div>
    <label for="password_confirmation">Confirmer le mot de passe</label>
    <input type="password" id="password_confirmation" name="password_confirmation" [(ngModel)]="password_confirmation" required>
  </div>

  <ul *ngIf="errorMessages.length">
    <li *ngFor="let msg of errorMessages">{{ msg }}</li>
  </ul>

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Inscription...' : "S'inscrire" }}
  </button>
</form>

<p>Déjà un compte ? <a routerLink="/connexion">Se connecter</a></p>
